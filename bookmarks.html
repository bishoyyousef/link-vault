<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bookmarks - LinkVault</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link href="css/style.css" rel="stylesheet">
</head>
<body>

<div id="navbar-container"></div>

<main class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>Bookmarks</h2>
        <div>
            <button class="btn btn-outline-secondary me-2" onclick="exportBookmarks()">
                <i class="bi bi-download"></i> Export
            </button>
            <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#bookmarkModal" id="btn-create-bookmark">
                <i class="bi bi-plus-lg"></i> New Bookmark
            </button>
        </div>
    </div>

    <!-- Filters -->
    <div class="card mb-4">
        <div class="card-body">
            <form id="filter-form" class="row g-3 align-items-end">
                <div class="col-md-3">
                    <div class="search-wrapper">
                        <i class="bi bi-search"></i>
                        <input type="text" class="form-control" id="filter-search" placeholder="Search bookmarks...">
                    </div>
                </div>
                <div class="col-md-3">
                    <label class="form-label d-none d-md-block">Category</label>
                    <select class="form-select" id="filter-category">
                        <option value="">All Categories</option>
                        <!-- Dynamic options -->
                    </select>
                </div>
                <div class="col-md-2">
                    <label class="form-label d-none d-md-block">Sort By</label>
                    <select class="form-select" id="filter-sort">
                        <option value="date-desc">Newest First</option>
                        <option value="date-asc">Oldest First</option>
                        <option value="title-asc">Title (A-Z)</option>
                        <option value="title-desc">Title (Z-A)</option>
                        <option value="favorite">Favorites First</option>
                    </select>
                </div>
                <div class="col-md-2">
                    <div class="form-check mt-2 mt-md-0">
                        <input class="form-check-input" type="checkbox" id="filter-favorite">
                        <label class="form-check-label" for="filter-favorite">Favorites only</label>
                    </div>
                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" id="filter-archived">
                        <label class="form-check-label" for="filter-archived">Archived only</label>
                    </div>
                </div>
                <div class="col-md-2 text-md-end mt-3 mt-md-0">
                    <button type="button" class="btn btn-outline-secondary w-100" id="btn-clear-filters">Clear</button>
                </div>
            </form>
        </div>
    </div>

    <div id="bookmarks-container">
        <!-- Loader initially -->
        <div class="spinner-container">
            <div class="spinner-border text-primary" role="status">
                <span class="visually-hidden">Loading...</span>
            </div>
        </div>
    </div>

    <div id="pagination-container"></div>
</main>

<!-- Bookmark Modal -->
<div class="modal fade" id="bookmarkModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <form id="bookmark-form">
                <div class="modal-header">
                    <h5 class="modal-title" id="bookmarkModalTitle">Create Bookmark</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <input type="hidden" id="bm-id">
                    <div class="mb-3">
                        <label class="form-label">URL</label>
                        <input type="url" class="form-control" id="bm-url" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Title</label>
                        <input type="text" class="form-control" id="bm-title" required maxlength="200">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Category</label>
                        <select class="form-select" id="bm-category" required>
                            <option value="">Select a category</option>
                            <!-- Dynamic options -->
                        </select>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="submit" class="btn btn-primary" id="btn-save-bookmark">Save Bookmark</button>
                </div>
            </form>
        </div>
    </div>
</div>

<!-- Scripts -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/utils.js"></script>
<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script src="js/ui.js"></script>
<script src="js/navbar.js"></script>
<script src="js/bookmarks.js"></script>
</body>
</html>
